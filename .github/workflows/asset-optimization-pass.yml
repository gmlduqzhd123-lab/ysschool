name: Asset Optimization Pass

on:
  push:
    branches:
      - chatgpt/ysschool-quality-pass-3-20260928
    paths:
      - .github/workflows/asset-optimization-pass.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ysschool-quality-pass-3-20260928

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0

      - name: Optimize heavy image assets
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path('.')

          def open_oriented(path: Path):
              img = Image.open(path)
              return ImageOps.exif_transpose(img)

          def resize_max(img, max_side):
              w, h = img.size
              scale = min(1.0, max_side / max(w, h))
              if scale < 1:
                  img = img.resize((max(1, round(w * scale)), max(1, round(h * scale))), Image.Resampling.LANCZOS)
              return img

          for i in range(1, 12):
              src = root / f'public/images/awards/award_{i}.png'
              dst = src.with_suffix('.webp')
              if not src.exists():
                  raise SystemExit(f'Missing expected award image: {src}')
              img = resize_max(open_oriented(src).convert('RGB'), 1800)
              img.save(dst, 'WEBP', quality=88, method=6)
              print(f'{src}: {src.stat().st_size:,} -> {dst.stat().st_size:,}')
              src.unlink()

          book = root / 'public/images/book_cover_2.png'
          if book.exists():
              dst = book.with_suffix('.webp')
              img = resize_max(open_oriented(book).convert('RGB'), 1600)
              img.save(dst, 'WEBP', quality=88, method=6)
              print(f'{book}: {book.stat().st_size:,} -> {dst.stat().st_size:,}')
              book.unlink()

          hero = root / 'public/images/profile_hero.jpg'
          if hero.exists():
              before = hero.stat().st_size
              img = resize_max(open_oriented(hero).convert('RGB'), 1800)
              img.save(hero, 'JPEG', quality=86, optimize=True, progressive=True)
              print(f'{hero}: {before:,} -> {hero.stat().st_size:,}')

          for size in (192, 512):
              icon = root / f'public/icons/icon-{size}x{size}.png'
              if icon.exists():
                  before = icon.stat().st_size
                  img = open_oriented(icon).convert('RGBA')
                  if img.size != (size, size):
                      img = img.resize((size, size), Image.Resampling.LANCZOS)
                  img.save(icon, 'PNG', optimize=True, compress_level=9)
                  print(f'{icon}: {before:,} -> {icon.stat().st_size:,}')

          data = root / 'src/data/dummyData.ts'
          text = data.read_text(encoding='utf-8')
          for i in range(1, 12):
              text = text.replace(f'/images/awards/award_{i}.png', f'/images/awards/award_{i}.webp')
          text = text.replace('/images/book_cover_2.png', '/images/book_cover_2.webp')
          data.write_text(text, encoding='utf-8')
          PY

      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images public/icons src/data/dummyData.ts
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "perf: compress large portfolio image assets"
          git push origin HEAD:chatgpt/ysschool-quality-pass-3-20260928
