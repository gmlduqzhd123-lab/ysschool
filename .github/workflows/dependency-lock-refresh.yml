name: Dependency Lock Refresh

on:
  push:
    branches:
      - chatgpt/ysschool-quality-pass-2-20260928
    paths:
      - .github/workflows/dependency-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/ysschool-quality-pass-2-20260928

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Upgrade vulnerable dependency chain
        run: |
          npm install --package-lock-only --save-exact next@16.3.6 @next/mdx@16.3.6
          npm install --package-lock-only --save-dev --save-exact eslint-config-next@16.3.6
          npm audit fix --package-lock-only

      - name: Verify production dependency audit
        run: npm audit --omit=dev

      - name: Commit refreshed package files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "security: upgrade Next.js and resolve dependency audit"
          git push origin HEAD:chatgpt/ysschool-quality-pass-2-20260928
