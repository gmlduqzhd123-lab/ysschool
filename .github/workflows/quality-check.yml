name: Quality Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (report only)
        run: npm audit --omit=dev || true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate learning game count and local links
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const packs = [
            'learning-games',
            ...Array.from({ length: 9 }, (_, i) => `learning-games-${i + 2}`),
          ];

          let total = 0;
          const missing = [];

          for (const pack of packs) {
            const dir = path.join('public', pack);
            const htmlFiles = fs.readdirSync(dir)
              .filter((name) => name.endsWith('.html') && name !== 'index.html');
            total += htmlFiles.length;

            const indexPath = path.join(dir, 'index.html');
            if (!fs.existsSync(indexPath)) missing.push(indexPath);
          }

          if (total !== 100) {
            throw new Error(`Expected 100 learning game HTML files, found ${total}`);
          }

          if (missing.length) {
            throw new Error(`Missing game index files: ${missing.join(', ')}`);
          }

          console.log(`Validated ${total} learning game HTML files across ${packs.length} packs.`);
          NODE

      - name: Validate showcase mini apps
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const dataFile = fs.readFileSync('src/data/showcaseData.ts', 'utf8');
          const appUrls = [...dataFile.matchAll(/appUrl:\s*['"]([^'"]+)['"]/g)].map((match) => match[1]);

          if (appUrls.length < 5) {
            throw new Error(`Expected at least 5 showcase mini apps, found ${appUrls.length}.`);
          }

          const seen = new Set();
          for (const rawUrl of appUrls) {
            const cleanUrl = rawUrl.split('?')[0].split('#')[0];
            if (seen.has(cleanUrl)) throw new Error(`Duplicate showcase app URL: ${cleanUrl}`);
            seen.add(cleanUrl);

            if (!cleanUrl.startsWith('/apps/') || !cleanUrl.endsWith('.html')) {
              throw new Error(`Unexpected local showcase app URL: ${rawUrl}`);
            }

            const file = path.join('public', cleanUrl);
            if (!fs.existsSync(file)) throw new Error(`Missing showcase app file: ${file}`);

            const html = fs.readFileSync(file, 'utf8');
            if (!/<meta[^>]+name=["']viewport["']/i.test(html)) {
              throw new Error(`${file} is missing a viewport meta tag.`);
            }
            if (!/<title>[^<]+<\/title>/i.test(html)) {
              throw new Error(`${file} is missing a document title.`);
            }

            const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map((match) => match[1]);
            const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
            if (duplicates.length) {
              throw new Error(`${file} has duplicate ids: ${[...new Set(duplicates)].join(', ')}`);
            }

            const idSet = new Set(ids);
            const referencedIds = [...html.matchAll(/getElementById\(["']([^"']+)["']\)/g)].map((match) => match[1]);
            const missingIds = [...new Set(referencedIds.filter((id) => !idSet.has(id)))];
            if (missingIds.length) {
              throw new Error(`${file} references missing ids: ${missingIds.join(', ')}`);
            }

            const handlers = [...html.matchAll(/\bon\w+=["']([A-Za-z_$][\w$]*)\s*\(/g)].map((match) => match[1]);
            const functions = new Set([...html.matchAll(/function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map((match) => match[1]));
            const missingHandlers = [...new Set(handlers.filter((name) => !functions.has(name)))];
            if (missingHandlers.length) {
              throw new Error(`${file} uses undefined inline handlers: ${missingHandlers.join(', ')}`);
            }

            const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
              .map((match) => match[1])
              .filter((source) => source.trim());

            for (const source of scripts) {
              new Function(source);
            }

            console.log(`Validated showcase app: ${file}`);
          }

          console.log(`Validated ${appUrls.length} showcase mini apps.`);
          NODE

      - name: Validate Math Survival mobile build
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = [
            'public/math_survival.html',
            'public/apps/math-survival.html',
          ];

          const contents = files.map((file) => {
            if (!fs.existsSync(file)) throw new Error(`Missing ${file}`);
            return fs.readFileSync(file, 'utf8');
          });

          if (contents[0] !== contents[1]) {
            throw new Error('Math Survival root and showcase copies are out of sync.');
          }

          const html = contents[0];
          const required = [
            'id="startBtn"',
            'id="joystickZone"',
            'id="dashBtn"',
            'joystickDelta',
            'body.game-running #joystickZone',
            'syncCanvasViewport',
            'white-space: nowrap',
            'touchcancel',
          ];

          for (const token of required) {
            if (!html.includes(token)) throw new Error(`Math Survival missing mobile token: ${token}`);
          }

          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1]);
          if (!scripts.length) throw new Error('Math Survival inline script not found.');

          for (const source of scripts) {
            new Function(source);
          }

          console.log('Validated Math Survival syntax, controls, and synchronized showcase build.');
          NODE
